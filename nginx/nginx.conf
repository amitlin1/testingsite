# ===========================================
# Nginx Configuration for Next.js Reverse Proxy
# ===========================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Max upload body size – must be >= the largest file upload going through Next.js → MinIO
    client_max_body_size 200m;

    # ---- Header sizes: REQUIRED for Keycloak / Auth.js sessions ----
    # The Auth.js session cookie is an encrypted JWE holding Keycloak's access,
    # refresh and id tokens. It runs to several KB and Auth.js splits it across
    # numbered chunks (authjs.session-token.0/.1/…). Two default limits break on it:
    #
    #  1. RESPONSE: /api/auth/callback/keycloak answers with the whole Set-Cookie
    #     chain at once. Over the default 4k/8k proxy buffer nginx aborts with
    #     "upstream sent too big header" → 502 on the login callback, so a user
    #     can authenticate at Keycloak and still never reach the app.
    #  2. REQUEST: the browser then sends that whole cookie chain back on EVERY
    #     request. Over the default large_client_header_buffers nginx answers 400.
    #
    # Neither shows up in dev (next dev serves directly, with no proxy in front).
    proxy_buffer_size          32k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size    64k;
    large_client_header_buffers 8 32k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Upstream for Next.js app
    upstream nextjs {
        server next-app:3000;
        keepalive 32;
    }

    # Docker's embedded DNS. Needed so the Keycloak proxy_pass below can resolve
    # LAZILY (see the /auth location). Without it, a variable proxy_pass has no
    # resolver and fails at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Serve runtime config.js (generated by entrypoint)
        location = /config.js {
            alias /usr/share/nginx/html/config.js;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Static assets with long cache
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Long cache for immutable static assets
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js image optimization
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public static files
        location /public {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=86400";
        }

        # API routes - no caching
        location /api {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for SSE/streaming responses
            proxy_buffering off;
            proxy_cache off;
            
            # Timeouts – extended for file uploads to MinIO
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ---- Keycloak, served under /auth ----
        # The Keycloak image is built with KC_HTTP_RELATIVE_PATH=/auth (it is a
        # BUILD-time option), so Keycloak itself serves under /auth/... and the
        # full URI is forwarded unchanged.
        #
        # WHY BEHIND THIS SAME NGINX: the OIDC issuer must be ONE string, and the
        # site is reached by IP. Putting Keycloak on the app's own origin means
        # the browser uses http://<ip>/auth/... for both. (Containers do NOT use
        # this path — they call http://keycloak:8080 directly, because a
        # container cannot connect back to the host's own LAN IP. See the
        # split-horizon note in the app-server compose file.)
        #
        # Without the trailing slash, /auth would fall through to `location /`
        # and be answered by the app with a 404 - so redirect it here.
        location = /auth {
            return 301 /auth/;
        }

        # LAZY RESOLUTION: proxy_pass via a VARIABLE (not an upstream block) so
        # nginx starts even when no `keycloak` container exists — an upstream with
        # an unresolvable name aborts startup, which would break any deployment
        # that runs the app without Keycloak.
        location /auth/ {
            set $keycloak_upstream http://keycloak:8080;
            proxy_pass $keycloak_upstream;
            proxy_http_version 1.1;

            # KC_PROXY_HEADERS=xforwarded — Keycloak reads these to rebuild the
            # URLs it shows the browser, so they must carry what the CLIENT asked
            # for. $http_host is the raw Host header INCLUDING any non-standard
            # port; $host would drop it, and $server_port is nginx's own port
            # inside the container (always 80), not the published one.
            #
            # In practice KC_HOSTNAME is set to the full public URL and wins over
            # these for URL construction; they are set correctly anyway so the
            # behaviour does not depend on that.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;

            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # OnlyOffice Document Server is NOT reverse-proxied here. It runs on its
        # own host port (default 8082) — OnlyOffice 9.x generates root-relative
        # URLs (/cache/, /coauthoring/) inside its editor iframe that don't
        # honour a sub-path prefix, so mounting it at /onlyoffice/ silently
        # breaks per-document Editor.bin caches.
        #
        # The OnlyOffice SERVER still reaches the app through this nginx, on the
        # docker network, as http://nginx/api/... (APP_INTERNAL_URL) — it cannot
        # use the public IP for the same reason the other containers cannot.

        # All other requests to Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
