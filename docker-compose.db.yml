# ===========================================
# Docker Compose - DB Server (PostgreSQL + MinIO)
# ===========================================
#
# Usage:
#   docker compose -f docker-compose.db.yml up -d
#
# Backups (automated, saved to Windows host folders):
#   - `minio-backup`    mirrors the bucket -> C:/backups/files
#   - `postgres-backup` dumps the database -> C:/backups/postgres/daily   (kept 7 days)
#                                          -> C:/backups/postgres/monthly (kept forever)
#   Both run every BACKUP_INTERVAL_SECONDS (default 24h). MinIO bucket
#   versioning (enabled by the app) makes overwrites/deletes recoverable
#   in-place. Override paths with BACKUP_FILES_PATH / BACKUP_PG_PATH.
#   Hebrew setup + restore guide: docs/גיבויים-README.md
#   English runbook: docs/STORAGE.md. Manual run: scripts/backup.sh.
#
# Data lives in named volumes managed by Docker.
# It persists across container restarts and image upgrades.
# Only 'docker compose down -v' will delete it.
#
# Firewall: open port 5432 (Postgres) and 9000 (MinIO API)
# to the PROD server's IP only. Port 9001 (MinIO console)
# should only be accessible from trusted admin IPs.
# ===========================================

services:
  # =========================================
  # PostgreSQL Database
  # =========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "timezone=UTC"

  # =========================================
  # MinIO Object Storage (S3-compatible)
  # =========================================
  minio:
    image: minio/minio:latest
    container_name: FileServiceDB
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.db
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API  – Next.js connects here
      - "9001:9001"   # MinIO Console (admin UI – restrict to trusted IPs)
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =========================================
  # MinIO Backup (incremental mirror via `mc`)
  # =========================================
  # Continuously mirrors the bucket to the Windows host folder C:/backups/files.
  # MinIO versioning (enabled by the app) protects against overwrite/delete
  # inside the primary store; this mirror protects against losing the volume.
  # `mc mirror` runs WITHOUT --remove, so files deleted in the bucket stay in
  # the backup folder (recoverable).
  minio-backup:
    image: minio/minio:latest
    container_name: FileServiceDB-backup
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    env_file:
      - .env.db
    environment:
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - MINIO_BUCKET=${MINIO_BUCKET:-digitalfactory-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set src http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "[minio-backup] waiting for minio..."; sleep 5;
        done
        while true; do
          echo "[minio-backup] $$(date -u +%FT%TZ) mirroring $$MINIO_BUCKET -> /backup";
          mc mirror --overwrite src/"$$MINIO_BUCKET" /backup || echo "[minio-backup] mirror failed";
          sleep "$$BACKUP_INTERVAL_SECONDS";
        done
    volumes:
      # Host folder on the (Windows) DB server. Override with BACKUP_FILES_PATH.
      - "${BACKUP_FILES_PATH:-C:/backups/files}:/backup"
    networks:
      - db-network
    depends_on:
      minio:
        condition: service_healthy

  # =========================================
  # PostgreSQL Backup (daily + monthly, gzipped)
  # =========================================
  # Each cycle (default once a day):
  #   - writes a DAILY dump   -> /backup/daily   (pruned after 7 days)
  #   - writes a MONTHLY dump -> /backup/monthly (one per month, NEVER pruned)
  # The monthly copy is idempotent: if this month's file already exists it is
  # left untouched, so restarts/missed days never create duplicates or skips.
  # Same image and same .env.db as the `postgres` service.
  postgres-backup:
    image: postgres:16-alpine
    container_name: digitalfactory-postgres-backup
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    env_file:
      - .env.db
    environment:
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_DAILY_RETENTION_DAYS=${BACKUP_DAILY_RETENTION_DAYS:-7}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backup/daily /backup/monthly;
        while true; do
          TS=$$(date -u +%Y%m%d-%H%M%S);
          MONTH=$$(date -u +%Y-%m);
          echo "[postgres-backup] $$TS dumping $$POSTGRES_DB";
          if PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" | gzip > /backup/daily/db-$$TS.sql.gz; then
            echo "[postgres-backup] wrote daily /backup/daily/db-$$TS.sql.gz";
            if [ ! -f /backup/monthly/db-$$MONTH.sql.gz ]; then
              cp /backup/daily/db-$$TS.sql.gz /backup/monthly/db-$$MONTH.sql.gz;
              echo "[postgres-backup] wrote permanent monthly /backup/monthly/db-$$MONTH.sql.gz";
            fi;
          else
            echo "[postgres-backup] dump failed"; rm -f /backup/daily/db-$$TS.sql.gz;
          fi;
          find /backup/daily -name 'db-*.sql.gz' -type f -mtime +$$BACKUP_DAILY_RETENTION_DAYS -delete 2>/dev/null || true;
          sleep "$$BACKUP_INTERVAL_SECONDS";
        done
    volumes:
      # Host folder on the (Windows) DB server. Override with BACKUP_PG_PATH.
      - "${BACKUP_PG_PATH:-C:/backups/postgres}:/backup"
    networks:
      - db-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  # Backups now go to host folders (C:/backups/files, C:/backups/postgres),
  # not named volumes — so they're easy to copy off-site and survive a
  # `docker compose down -v`.

networks:
  db-network:
    driver: bridge
    name: db-network
