<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .tn-burger { display: none; }
  @media (max-width: 980px) {
    .tn-header { inset-inline-start: 0 !important; }
    .tn-burger { display: inline-flex !important; }
  }
</style>
</helmet>
<div dir="rtl" style="font-family:'Heebo','Inter',system-ui,-apple-system,sans-serif;color:#1d1d1f;text-align:right">

  <div onClick="{{ closeNav }}" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:49;display:{{ backdropDisplay }}"></div>

  <!-- ===== Sidebar (all navigation) ===== -->
  <aside class="tn-aside" style="position:fixed;inset-inline-start:0;top:0;bottom:0;width:240px;background:#15171a;color:#fff;display:flex;flex-direction:column;z-index:50;transform:{{ asideTransform }};box-shadow:{{ asideShadow }}">
    <div style="height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0">
      <div style="width:26px;height:26px;border-radius:7px;background:#0066cc;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <span style="font-family:'Inter',sans-serif;font-size:15.5px;font-weight:700;letter-spacing:-0.3px">בקרת בדיקות</span>
    </div>

    <button style="margin:12px 14px 6px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#e7e7ea;border-radius:9px;height:38px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;justify-content:space-between" style-hover="background:rgba(255,255,255,0.1)">
      <span style="display:inline-flex;align-items:center;gap:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9fc6f5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h.01"/><path d="M9 12h.01"/></svg>מפעל ראשי</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b9097" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <nav style="flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:3px">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <a href="{{ n.href }}" style="display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:9px;font-size:14px;color:{{ n.color }};font-weight:{{ n.weight }};background:{{ n.bg }};text-decoration:none;cursor:pointer;position:relative;border-inline-start:3px solid {{ n.bar }}" style-hover="background:rgba(255,255,255,0.06);color:#fff">{{ n.icon }}{{ n.label }}</a>
      </sc-for>
      <div style="height:1px;background:rgba(255,255,255,0.08);margin:10px 4px"></div>
      <a href="Settings.dc.html" style="display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:9px;font-size:14px;color:{{ gearColor }};font-weight:{{ gearWeight }};background:{{ gearBg }};text-decoration:none;cursor:pointer;border-inline-start:3px solid {{ gearBar }}" style-hover="background:rgba(255,255,255,0.06);color:#fff">{{ gearIcon }}הגדרות מערכת</a>
    </nav>

    <div style="border-top:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div style="width:34px;height:34px;border-radius:9999px;background:#0066cc;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0">ד</div>
      <div style="line-height:1.2;min-width:0"><div style="font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">דנה כהן</div><div style="font-size:11.5px;color:#9aa0a6">מנהלת בקרה</div></div>
      <button title="התנתקות" style="margin-inline-start:auto;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#9aa0a6;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" style-hover="background:rgba(255,255,255,0.08);color:#fff"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </aside>

  <!-- ===== Single top bar ===== -->
  <header class="tn-header" style="position:fixed;top:0;inset-inline-start:240px;inset-inline-end:0;height:56px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:16px;padding:0 16px;z-index:45">
    <button onClick="{{ toggleNav }}" class="tn-burger" title="תפריט" style="width:36px;height:36px;border:1px solid #e0e0e0;border-radius:9px;background:#fff;color:#1d1d1f;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" style-hover="background:#f5f5f7"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg></button>
    <div style="display:flex;align-items:center;gap:9px;min-width:0">
      <span style="display:flex;color:#0066cc">{{ pageIcon }}</span>
      <span style="font-size:16px;font-weight:600;letter-spacing:-0.2px;white-space:nowrap">{{ pageTitle }}</span>
    </div>
    <div style="flex:1"></div>
    <div style="position:relative">
      <span style="position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:#7a7a7a;pointer-events:none;display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input placeholder="חיפוש פריט, משלוח או עמדה" style="width:280px;max-width:38vw;height:38px;border:1px solid #e0e0e0;border-radius:9999px;background:#f5f5f7;color:#1d1d1f;padding-inline-start:38px;padding-inline-end:14px;font-size:14px;outline:none" style-focus="border-color:#0071e3;background:#fff">
    </div>
    <button title="התראות" style="position:relative;width:36px;height:36px;border:1px solid #e0e0e0;border-radius:9px;background:#fff;color:#5a5a5f;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#f5f5f7;color:#1d1d1f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span style="position:absolute;top:7px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:#0066cc;border:1.5px solid #fff"></span></button>
    <button title="עזרה" style="width:36px;height:36px;border:1px solid #e0e0e0;border-radius:9px;background:#fff;color:#5a5a5f;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#f5f5f7;color:#1d1d1f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;items&quot;,&quot;options&quot;:[&quot;items&quot;,&quot;testing&quot;,&quot;dashboard&quot;,&quot;shipments&quot;,&quot;files&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  icons = {
    items: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>',
    testing: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v8.5a2.5 2.5 0 0 1-.4 1.4L3 22"/><path d="M14 2v8.5a2.5 2.5 0 0 0 .4 1.4L21 22"/><path d="M5.5 16h13"/><path d="M9 2h6"/></svg>',
    dashboard: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
    shipments: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>',
    files: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
    settings: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>',
  };
  titles = { items: "דוחות וניהול פריטים", testing: "מסך בדיקה", dashboard: "לוח ניהול", shipments: "משלוחים נכנסים", files: "ניהול קבצים", settings: "הגדרות מערכת" };

  state = { navOpen: false, isMobile: false };
  componentDidMount() {
    this._mq = window.matchMedia("(max-width: 980px)");
    this._sync = () => this.setState((s) => ({ isMobile: this._mq.matches, navOpen: this._mq.matches && s.navOpen }));
    this._sync();
    this._mq.addEventListener ? this._mq.addEventListener("change", this._sync) : this._mq.addListener(this._sync);
  }
  componentWillUnmount() { if (this._mq) { this._mq.removeEventListener ? this._mq.removeEventListener("change", this._sync) : this._mq.removeListener(this._sync); } }
  toggleNav = () => this.setState((s) => ({ navOpen: !s.navOpen }));
  closeNav = () => this.setState({ navOpen: false });

  renderVals() {
    const active = this.props.active || "items";
    const raw = (h) => React.createElement("span", { style: { display: "flex", flexShrink: 0 }, dangerouslySetInnerHTML: { __html: h } });
    const def = [
      { key: "items", label: "דוחות וניהול פריטים", href: "Items.dc.html" },
      { key: "testing", label: "מסך בדיקה", href: "Testing%20Screen.dc.html" },
      { key: "dashboard", label: "לוח ניהול", href: "Dashboard.dc.html" },
      { key: "shipments", label: "משלוחים נכנסים", href: "Shipments.dc.html" },
      { key: "files", label: "ניהול קבצים", href: "Files.dc.html" },
    ];
    const navItems = def.map((n) => {
      const on = n.key === active;
      return { label: n.label, href: n.href, icon: raw(this.icons[n.key]), color: on ? "#fff" : "#b8bcc2", weight: on ? "600" : "400", bg: on ? "rgba(41,151,255,0.14)" : "transparent", bar: on ? "#2997ff" : "transparent" };
    });
    const sOn = active === "settings";
    return {
      navItems,
      gearIcon: raw(this.icons.settings), gearColor: sOn ? "#fff" : "#b8bcc2", gearWeight: sOn ? "600" : "400", gearBg: sOn ? "rgba(41,151,255,0.14)" : "transparent", gearBar: sOn ? "#2997ff" : "transparent",
      pageTitle: this.titles[active] || "", pageIcon: raw(this.icons[active] || this.icons.items),
      asideTransform: this.state.isMobile ? (this.state.navOpen ? "translateX(0)" : "translateX(100%)") : "none",
      asideShadow: this.state.isMobile && this.state.navOpen ? "rgba(0,0,0,0.35) 0 0 50px" : "none",
      backdropDisplay: this.state.isMobile && this.state.navOpen ? "block" : "none",
      toggleNav: this.toggleNav, closeNav: this.closeNav,
    };
  }
}
</script>
</body>
</html>
