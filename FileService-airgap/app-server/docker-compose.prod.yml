# ===========================================
# APP SERVER  (Next.js + Nginx)  —  AIR-GAPPED / image-only
# ===========================================
# Images are pre-built and loaded from ./images (see scripts/1-load-images.ps1).
# There is NO `build:` section on purpose — this host cannot build.
# Connects to the DB server (Postgres + MinIO) over the network; set the DB
# server's IP in .env.prod (DB_SERVER_IP).
# ===========================================

services:
  next-app:
    image: testingsite-next-app:latest
    container_name: next-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - prod-network
    expose:
      - "3000"
    # Stateless: all files live in MinIO on the DB server.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: testingsite-nginx:latest
    container_name: nginx
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - prod-network
    depends_on:
      next-app:
        condition: service_healthy
    # Healthcheck overridden to probe IPv4 root through the proxy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  prod-network:
    driver: bridge
    name: prod-network
