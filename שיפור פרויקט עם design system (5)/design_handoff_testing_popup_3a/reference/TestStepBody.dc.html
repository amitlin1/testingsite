<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" style="font-family:'Heebo','Inter',system-ui,sans-serif;color:#1d1d1f;text-align:right;display:flex;flex-direction:column;gap:16px">

  <!-- ===== System note (shared block) ===== -->
  <sc-if value="{{ note }}" hint-placeholder-val="">
    <div style="background:rgba(0,102,204,0.05);border:1px solid rgba(0,102,204,0.14);border-radius:14px;padding:14px 16px">
      <div style="font-size:11px;font-weight:700;color:#0066cc;letter-spacing:0.02em;margin-bottom:4px">הודעת מערכת</div>
      <div style="font-size:15px;line-height:1.5;color:#1d1d1f">{{ note }}</div>
    </div>
  </sc-if>

  <!-- ===== SKU scan ===== -->
  <sc-if value="{{ isSku }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="font-size:13px;font-weight:600;color:#7a7a7a">מק״ט יצרן</label>
      <div style="position:relative">
        <span style="position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#9a9aa0;display:flex"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg></span>
        <input value="{{ sku }}" onInput="{{ onSku }}" placeholder="סרוק או הזן מק״ט…" style="width:100%;height:52px;border:1.5px solid #d4d4dc;border-radius:12px;padding-inline-start:44px;padding-inline-end:14px;font-size:16px;background:#fff;color:#1d1d1f;outline:none" style-focus="border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,0.14)">
      </div>
    </div>
  </sc-if>

  <!-- ===== Package photo (uploader + reference slots) ===== -->
  <sc-if value="{{ isPkg }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:18px">
      <!-- Photo column -->
      <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1;display:flex;gap:6px">
            <sc-for list="{{ slots }}" as="s" hint-placeholder-count="3"><div style="{{ s.barStyle }}"></div></sc-for>
          </div>
          <span style="font-size:12.5px;font-weight:700;color:#0066cc;background:rgba(0,102,204,0.08);border-radius:9999px;padding:4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap">{{ counterText }}</span>
        </div>
        <div style="position:relative;height:210px;border-radius:16px;overflow:hidden;border:1px solid #e0e0e0;background:{{ bigFrameBg }};display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ bigCaptured }}" hint-placeholder-val="{{ false }}">
            <div style="text-align:center;color:#1f8a5b"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><div style="font-size:13px;font-weight:600;margin-top:4px">צולם</div></div>
          </sc-if>
          <sc-if value="{{ bigEmpty }}" hint-placeholder-val="{{ true }}">
            <div style="text-align:center;color:#9a9aa0"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg><div style="font-size:13px;margin-top:6px">תמונת ייחוס · צלם את הפריט</div></div>
          </sc-if>
          <span style="position:absolute;top:11px;inset-inline-end:11px;font-size:11px;font-weight:600;color:{{ pillColor }};background:rgba(255,255,255,0.85);border-radius:9999px;padding:3px 10px">{{ pillText }}</span>
        </div>
        <button onClick="{{ onCapture }}" style="width:100%;height:50px;border:none;border-radius:12px;background:#0066cc;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px" style-hover="background:#0058b3" style-active="transform:scale(0.98)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>{{ captureLabel }}</button>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ slots }}" as="s" hint-placeholder-count="3">
            <div style="{{ s.thumbStyle }}">
              <sc-if value="{{ s.captured }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:9999px;background:#1f8a5b;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
              <sc-if value="{{ s.empty }}" hint-placeholder-val="{{ true }}"><span style="font-size:9px;font-weight:600;color:#9a9aa0">ייחוס {{ s.n }}</span></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
      <!-- Verdict column -->
      <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:14px;font-weight:600;color:#1d1d1f">בדיקה תקינה?</div>
        <div style="display:flex;gap:12px">
          <button onClick="{{ onPass }}" style="{{ passStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>תקין</button>
          <button onClick="{{ onFail }}" style="{{ failStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>לא תקין</button>
        </div>
        <label style="font-size:13px;font-weight:600;color:#7a7a7a;margin-top:4px">הערות</label>
        <textarea value="{{ pkgNote }}" onInput="{{ onNote }}" rows="3" placeholder="הוסף הערה…" style="width:100%;border:1.5px solid #d4d4dc;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;resize:none;background:#fff;color:#1d1d1f;outline:none" style-focus="border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,0.14)"></textarea>
      </div>
    </div>
  </sc-if>

  <!-- ===== Count / labels ===== -->
  <sc-if value="{{ isCount }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="font-size:13px;font-weight:600;color:#7a7a7a">כמה פריטים בתוך המארז?</label>
      <input value="{{ count }}" onInput="{{ onCount }}" type="number" placeholder="0" style="width:100%;height:52px;border:1.5px solid #d4d4dc;border-radius:12px;padding:0 16px;font-size:20px;font-weight:600;background:#fff;color:#1d1d1f;outline:none;font-variant-numeric:tabular-nums" style-focus="border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,0.14)">
    </div>
    <div style="font-size:14px;font-weight:600;color:#1d1d1f;margin-top:4px">האם יש צורך בהדפסת מדבקות ברקוד נוספות?</div>
    <div style="display:flex;gap:12px">
      <button onClick="{{ onLabelsYes }}" style="{{ labelsYesStyle }}">כן</button>
      <button onClick="{{ onLabelsNo }}" style="{{ labelsNoStyle }}">לא</button>
    </div>
    <sc-if value="{{ labelsYes }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <label style="font-size:13px;font-weight:600;color:#7a7a7a">כמות מדבקות (ID זהה למארז)</label>
        <input value="{{ labelQty }}" onInput="{{ onLabelQty }}" type="number" placeholder="0" style="width:100%;height:48px;border:1.5px solid #d4d4dc;border-radius:12px;padding:0 16px;font-size:16px;background:#fff;color:#1d1d1f;outline:none" style-focus="border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,0.14)">
      </div>
    </sc-if>
  </sc-if>

  <!-- ===== Weigh / deviation ===== -->
  <sc-if value="{{ isWeigh }}" hint-placeholder-val="{{ false }}">
    <sc-if value="{{ isAll }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px"><div style="height:1px;flex:1;background:#e0e0e0"></div><span style="font-size:12px;font-weight:700;color:#9a9aa0;letter-spacing:0.04em">שקילה</span><div style="height:1px;flex:1;background:#e0e0e0"></div></div>
    </sc-if>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px">
        <label style="font-size:13px;font-weight:600;color:#7a7a7a">משקל פריט ייחוס (גר׳)</label>
        <div style="height:52px;border:1.5px solid #e0e0e0;border-radius:12px;padding:0 16px;display:flex;align-items:center;font-size:18px;font-weight:600;color:#7a7a7a;background:#fafafc;font-variant-numeric:tabular-nums">{{ refWeight }}</div>
      </div>
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px">
        <label style="font-size:13px;font-weight:600;color:#7a7a7a">משקל פריט נבדק (גר׳)</label>
        <input value="{{ measured }}" onInput="{{ onMeasured }}" type="number" placeholder="0" style="width:100%;height:52px;border:1.5px solid #d4d4dc;border-radius:12px;padding:0 16px;font-size:18px;font-weight:600;background:#fff;color:#1d1d1f;outline:none;font-variant-numeric:tabular-nums" style-focus="border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,0.14)">
      </div>
    </div>
    <sc-if value="{{ showDev }}" hint-placeholder-val="{{ false }}">
      <div style="{{ devBoxStyle }}">
        <span style="display:flex">{{ devIcon }}</span>
        <span>{{ devText }}</span>
      </div>
    </sc-if>
  </sc-if>

  <!-- ===== Accessories ===== -->
  <sc-if value="{{ isAcc }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ accessories }}" as="a" hint-placeholder-count="2">
      <div style="border:1px solid #e0e0e0;border-radius:14px;padding:16px">
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px">
          <sc-if value="{{ a.done }}" hint-placeholder-val="{{ false }}"><span style="color:#1f8a5b;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span></sc-if>
          <span>{{ a.title }}</span>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          <input value="{{ a.sku }}" placeholder="מק״ט יצרן" style="flex:1;height:44px;border:1.5px solid #d4d4dc;border-radius:10px;padding:0 14px;font-size:15px;background:#fff;color:#1d1d1f;outline:none;font-family:inherit" style-focus="border-color:#0071e3">
          <button style="{{ a.btnStyle }}">{{ a.btnLabel }}</button>
        </div>
      </div>
    </sc-for>
    <button style="align-self:flex-start;display:flex;align-items:center;gap:6px;background:none;border:none;color:#0066cc;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>הוסף פריט</button>
  </sc-if>

  <!-- ===== Transfer / done ===== -->
  <sc-if value="{{ isTransfer }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0 8px">
      <span style="width:72px;height:72px;border-radius:9999px;background:rgba(31,138,91,0.1);color:#1f8a5b;display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span>
      <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px">קליטה וצילום הושלמו</div>
      <div style="background:rgba(0,102,204,0.05);border:1px solid rgba(0,102,204,0.14);border-radius:14px;padding:14px 18px;max-width:420px;text-align:center;font-size:15px;line-height:1.5">נא להעביר את המוצר לעמדת פירוק והרכבה.</div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:460},&quot;phase&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sku&quot;,&quot;pkgPhoto&quot;,&quot;count&quot;,&quot;weigh&quot;,&quot;accessories&quot;,&quot;transfer&quot;],&quot;default&quot;:&quot;pkgPhoto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { cap: 0, ok: "", note: "", sku: "", count: "", labels: "", labelQty: "", measured: "" };

  set = (patch) => this.setState(patch);

  renderVals() {
    const phase = this.props.phase ?? "pkgPhoto";
    const s = this.state;
    const HAIR = "#e0e0e0", OK = "#1f8a5b", BAD = "#bf3535", BLUE = "#0066cc";

    const all = phase === "all";
    const notes = {
      sku: "יש לסרוק את מק״ט היצרן של המוצר. פרטי הסריקה נשמרים במערכת ובדו״ח.",
      accessories: "לכל פריט נלווה: הזן את מק״ט היצרן ולחץ בדיקה. יש לבדוק את כל הפריטים.",
      weigh: "נא לשקול את הפריט ולהזין את המשקל שנמדד. הסטייה מחושבת אוטומטית.",
      all: "בצע את הבדיקה, תעד בתמונות, שקול ורשום הערות. הכל במסך אחד.",
    };

    // photo slots
    const TOTAL = 3;
    const cap = s.cap;
    const slots = Array.from({ length: TOTAL }, (_, i) => {
      const captured = i < cap;
      const active = i === Math.min(cap, TOTAL - 1);
      return {
        n: i + 1, captured, empty: !captured,
        barStyle: `flex:1;height:4px;border-radius:9999px;background:${captured ? OK : active ? BLUE : HAIR}`,
        thumbStyle: `flex:0 0 auto;width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:${captured ? "rgba(31,138,91,0.08)" : "#f0f0f2"};border:${active ? `2.5px solid ${BLUE}` : captured ? `1.5px solid ${OK}` : `1.5px solid ${HAIR}`}`,
      };
    });
    const bigCaptured = cap > 0 && cap >= TOTAL ? true : false;
    const bigCapturedNow = cap >= TOTAL;

    // pass/fail styles
    const btnBase = "flex:1;height:50px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;";
    const passStyle = s.ok === "pass"
      ? btnBase + `border:1.5px solid ${OK};background:rgba(31,138,91,0.08);color:${OK}`
      : btnBase + `border:1.5px solid ${HAIR};background:#fff;color:#1d1d1f`;
    const failStyle = s.ok === "fail"
      ? btnBase + `border:1.5px solid ${BAD};background:rgba(191,53,53,0.08);color:${BAD}`
      : btnBase + `border:1.5px solid ${HAIR};background:#fff;color:#1d1d1f`;

    // labels toggle
    const segBase = "flex:1;height:48px;border-radius:9999px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;";
    const segOn = `border:none;background:${BLUE};color:#fff`;
    const segOff = `border:1.5px solid ${HAIR};background:#fff;color:#1d1d1f`;

    // weigh
    const REF = 1240;
    const m = Number(s.measured);
    const showDev = s.measured !== "" && !Number.isNaN(m);
    let devText = "", devPass = false, devBoxStyle = "", devIcon = null;
    if (showDev) {
      const diff = m - REF, pct = Math.abs(diff) / REF * 100;
      devPass = pct <= 5;
      devText = `${devPass ? "משקל תקין" : "משקל לא תקין"} — סטייה ${diff > 0 ? "+" : ""}${diff.toFixed(0)} גר׳ (${pct.toFixed(1)}% · סטייה תקנית ±5%)`;
      const c = devPass ? OK : BAD, bg = devPass ? "rgba(31,138,91,0.08)" : "rgba(191,53,53,0.08)";
      devBoxStyle = `display:flex;align-items:center;gap:10px;background:${bg};border:1px solid ${devPass ? "rgba(31,138,91,0.25)" : "rgba(191,53,53,0.25)"};border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600;color:${c}`;
      const path = devPass ? "M22 11.08V12a10 10 0 1 1-5.93-9.14||m9 11 3 3L22 4" : "M12 9v4||M12 17h.01||M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0";
      devIcon = React.createElement("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.9, strokeLinecap: "round", strokeLinejoin: "round" },
        path.split("||").map((d, i) => React.createElement("path", { key: i, d })));
    }

    // accessories
    const accBtn = (done) => done
      ? "border:1.5px solid #0066cc;background:#fff;color:#0066cc;border-radius:9999px;padding:0 22px;height:44px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap"
      : "border:none;background:#0066cc;color:#fff;border-radius:9999px;padding:0 22px;height:44px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap";
    const accessories = [
      { title: "מטען · S/N 4471 · #10293", sku: "PA-1100-XL", done: true, btnLabel: "בדוק שוב", btnStyle: accBtn(true) },
      { title: "כבל נתונים · S/N 4472 · #10294", sku: "", done: false, btnLabel: "בדיקה", btnStyle: accBtn(false) },
    ];

    return {
      note: notes[phase] ?? "",
      isAll: all,
      isSku: phase === "sku", isPkg: phase === "pkgPhoto" || all, isCount: phase === "count",
      isWeigh: phase === "weigh" || all, isAcc: phase === "accessories", isTransfer: phase === "transfer",

      sku: s.sku, onSku: (e) => this.set({ sku: e.target.value }),

      slots,
      counterText: `${Math.min(cap, TOTAL)} / ${TOTAL} צולמו`,
      bigFrameBg: bigCapturedNow ? "rgba(31,138,91,0.06)" : "#f0f0f2",
      bigCaptured: bigCapturedNow, bigEmpty: !bigCapturedNow,
      pillText: bigCapturedNow ? "צולם" : "תמונת ייחוס",
      pillColor: bigCapturedNow ? OK : "#8a7c68",
      captureLabel: cap >= TOTAL ? "צלם מחדש / הוסף" : "צלם / העלה",
      onCapture: () => this.set({ cap: cap >= TOTAL ? 0 : cap + 1 }),

      passStyle, failStyle,
      onPass: () => this.set({ ok: "pass" }), onFail: () => this.set({ ok: "fail" }),
      pkgNote: s.note, onNote: (e) => this.set({ note: e.target.value }),

      count: s.count, onCount: (e) => this.set({ count: e.target.value }),
      labelsYes: s.labels === "yes",
      labelsYesStyle: segBase + (s.labels === "yes" ? segOn : segOff),
      labelsNoStyle: segBase + (s.labels === "no" ? segOn : segOff),
      onLabelsYes: () => this.set({ labels: "yes" }), onLabelsNo: () => this.set({ labels: "no" }),
      labelQty: s.labelQty, onLabelQty: (e) => this.set({ labelQty: e.target.value }),

      refWeight: REF, measured: s.measured, onMeasured: (e) => this.set({ measured: e.target.value }),
      showDev, devText, devBoxStyle, devIcon,

      accessories,
    };
  }
}
</script>
</body>
</html>
