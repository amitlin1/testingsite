# encoding: UTF-8
#
# Deliberately Hebrew, not English.
#
# The realm advertises supportedLocales ["en","he"], and Keycloak picks the
# locale from the browser's Accept-Language BEFORE falling back to the realm's
# defaultLocale=he. A Chrome set to English therefore asked for `en`, found no
# `en` bundle in this theme, and fell through to Keycloak's OWN English base --
# which is how the login page came up reading "Sign in to {0}" / "loginSubtitle"
# while the rest of the page (hardcoded in template.ftl) stayed Hebrew.
#
# This is a Hebrew-only internal system with one login screen, so the honest fix
# is one screen in one language whatever the browser asks for. Keep this file in
# sync with messages_he.properties.
doLogIn=כניסה
usernameOrEmail=מספר עובד
password=סיסמא
loginTitle=כניסה למערכת

# generic auth errors -> single clear message (no user enumeration)
invalidUserMessage=שם משתמש או סיסמה שגויים
accountTemporarilyDisabledMessage=החשבון ננעל זמנית עקב ריבוי ניסיונות. נסה שוב מאוחר יותר או פנה למנהל.
accountDisabledMessage=החשבון מושבת. פנה למנהל המערכת.

# forced password update
updatePasswordTitle=עדכון סיסמה
updatePasswordMessage=התחברת עם סיסמה זמנית. יש להגדיר סיסמה קבועה חדשה כדי להמשיך.
passwordNew=סיסמה חדשה
passwordConfirm=אימות סיסמה
passwordHint=לפחות 8 תווים, הכוללים אות ומספר.
doUpdatePassword=עדכן סיסמה

# page expired
pageExpiredTitle=פג תוקף הדף
pageExpiredMsg1=חזור והתחבר מחדש כדי להמשיך.
doRestartLogin=חזרה להתחברות

# update profile (required action: update account information)
updateProfileTitle=השלמת פרטי משתמש
updateProfileSubtitle=יש להשלים את הפרטים הבאים כדי להמשיך.
doSubmit=שמירה

# user profile attribute labels (Hebrew, RTL)
username=שם משתמש
email=דוא"ל
firstName=שם פרטי
lastName=שם משפחה

# field validation
missingUsernameMessage=יש להזין מספר עובד.
missingPasswordMessage=יש להזין סיסמה.
error-user-attribute-required=יש למלא שדה זה.
error-invalid-email=כתובת דוא"ל אינה תקינה.
error-invalid-length=אורך הערך אינו תקין.
error-person-name-invalid-character=השם מכיל תווים לא חוקיים.
